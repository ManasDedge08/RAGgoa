services:
  - type: web
    name: measure-rag-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Free tier by explicit choice. Measured, not assumed: eleven languages at
    # 1,200 query ids sits at 1.29 GB RSS locally, and the free instance caps at
    # 512 MB. The corpus is therefore cut to 250 query ids here, which scales
    # the index to roughly a fifth.
    #
    # Whether that fits is genuinely uncertain, because index vectors and the
    # FAISS graphs are memory-mapped: much of the RSS above is evictable page
    # cache rather than a hard requirement. What is not evictable is the Python
    # process, torch, and the two models (encoder + cross-encoder).
    #
    # If it is OOM-killed, the levers in order of effect:
    #   1. RAG_N_QUERY_IDS=150   - shrinks every index proportionally again
    #   2. RAG_RELEVANCE_GATE=0  - drops the cross-encoder, and with it the
    #                              ability to decline out-of-corpus questions
    #   3. a 2 GB plan           - comfortable at 800 ids
    plan: free
    healthCheckPath: /health
    envVars:
      - key: SARVAM_API_KEY
        sync: false
      - key: RAG_N_QUERY_IDS
        value: "250"
      # Must match the list baked into the image at build time.
      - key: RAG_LANGUAGES
        value: eng_Latn,hin_Deva,ben_Beng,tam_Taml,tel_Telu,mar_Deva,guj_Gujr,kan_Knda,mal_Mlym,pan_Guru,ori_Orya
      - key: SARVAM_CHAT_MODEL
        value: sarvam-105b-conversations
      - key: SARVAM_STT_MODEL
        value: saaras:v4
      - key: SARVAM_TTS_MODEL
        value: bulbul:v2
      - key: SARVAM_REASONING_EFFORT
        value: low
